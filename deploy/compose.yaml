services:
  messenger-mcp:
    labels:
      # No Traefik route. The server has no authentication of its own; network
      # isolation inside homelab-network is the whole of its access control.
      # MCPHub reaches it at http://messenger-mcp:8000/mcp.
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: ghcr.io/rgryta/messenger-sync:latest
    container_name: messenger-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No `env_file` and no credential: this container reads the archive and nothing else.
    environment:
      MESSENGER_DSN: postgresql://messenger_mcp:${MESSENGER_MCP_DB_PASSWORD}@homelab-postgres:5432/messenger
      MESSENGER_HOST: 0.0.0.0
      MESSENGER_PORT: "8000"
      MESSENGER_MCP_ALLOWED_HOSTS: messenger-mcp
      TZ: Europe/Warsaw
    command:
      - /usr/local/bin/messenger-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.88
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/messenger-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Messenger without a browser: the LightSpeed gateway for the inbox, and the encrypted
  # chat as the adopted browser device for one-to-one text. The only container with the
  # login and the device keys (both in the database's private schemas), and the only one
  # with DDL rights: it applies the migrations at boot. Exposes no port.
  #
  # No healthcheck: the inbox loop sleeps ~15 minutes between passes by design. The MCP
  # status tool shows both loops' last run.
  messenger-client:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: ghcr.io/rgryta/messenger-sync:latest
    container_name: messenger-client
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MESSENGER_DSN: postgresql://messenger_ingest:${MESSENGER_INGEST_DB_PASSWORD}@homelab-postgres:5432/messenger
      MESSENGER_ACCOUNT: ${MESSENGER_ACCOUNT}
      TZ: Europe/Warsaw
      # First start only, at cutover: the cookie export and the device export to adopt
      # (formats in `crates/client/src/bin/messenger-client.rs`), mounted from
      # /mnt/quick/apps/volumes/messenger-sync/client. Ignored once stored; remove the two
      # files, these lines and the volume once the log says both were adopted.
      # MESSENGER_COOKIES_FROM: /adopt/cookies.json
      # MESSENGER_DEVICE_FROM: /adopt/device.json
    # volumes:
    #   - /mnt/quick/apps/volumes/messenger-sync/client:/adopt:ro
    command:
      - /usr/local/bin/messenger-client
    networks:
      homelab-network:
        ipv4_address: 172.20.0.89
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

networks:
  homelab-network:
    external: true
